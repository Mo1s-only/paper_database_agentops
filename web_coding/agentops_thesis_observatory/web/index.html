<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14242d">
  <meta name="description" content="按每次运行查看真实 API、跨层关联、Trace 与原始数据的本地实验平台。">
  <title>AgentOps · 实验工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314242d'/%3E%3Cpath d='M8 22l8-14 8 14M12 17h8' fill='none' stroke='%235dd8b3' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=2.0">
  <script src="/app.js?v=2.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="实验导航">
      <a class="brand" href="#runs" aria-label="AgentOps 实验工作台首页">
        <span class="brand-mark" aria-hidden="true">A<span>·</span></span>
        <span><strong>AgentOps</strong><small>实验工作台 / OBSERVATORY</small></span>
      </a>
      <div class="workspace-label"><span class="tiny-dot"></span> 本地研究空间 <span class="version">02</span></div>
      <nav class="primary-nav">
        <a href="#runs" id="nav-runs"><span aria-hidden="true">▦</span> 所有运行 <span id="run-count" class="nav-count">—</span></a>
        <a href="#new" id="nav-new"><span aria-hidden="true">＋</span> 新建实验</a>
      </nav>
      <div class="sidebar-section-heading"><span>最近运行</span><button class="icon-button" id="rescan-button" title="重新扫描实验工件" aria-label="重新扫描实验工件">↻</button></div>
      <div id="recent-runs" class="recent-runs"><p class="sidebar-muted">正在读取实验记录…</p></div>
      <div class="sidebar-bottom">
        <div class="connection"><span id="connection-dot" class="connection-dot"></span><span id="connection-label">连接本地服务…</span></div>
        <p>每次运行独立记录<br>从结果追溯到原始工件</p>
      </div>
    </aside>
    <div class="content-shell">
      <header class="topbar"><div class="breadcrumb"><span>研究工作区</span><span aria-hidden="true">/</span><strong id="breadcrumb-current">实验运行</strong></div><span id="live-indicator" class="live-indicator"><span></span> 仅本地</span></header>
      <main id="main" tabindex="-1"><div class="initial-loading"><span class="spinner"></span><p>正在读取本地实验与证据…</p></div></main>
      <footer class="page-footer">AgentOps Thesis Observatory <span>数据来自所选运行的 SQLite 与原始工件</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>请开启 JavaScript 以使用本地实验工作台。</noscript>
</body>
</html>
